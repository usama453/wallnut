<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="Inter, system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1"/>
    </marker>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="grad-vercel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="grad-supabase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#065f46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="grad-meta" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="grad-google" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c2d12"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="grad-ms" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1100" height="820" rx="12" fill="#0f172a"/>

  <!-- Title -->
  <text x="550" y="44" text-anchor="middle" font-size="22" font-weight="700" fill="#f1f5f9">Wallnut — System Architecture</text>
  <text x="550" y="64" text-anchor="middle" font-size="12" fill="#64748b">AI Proofing Bot for Marketing Assets · aiproof-beta.vercel.app</text>

  <!-- ═══════════════════ USERS / ENTRY POINTS ═══════════════════ -->

  <!-- WhatsApp User -->
  <g transform="translate(60, 100)">
    <rect width="150" height="64" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="28" cy="26" r="12" fill="#25D366"/>
    <text x="28" y="30" text-anchor="middle" font-size="13" fill="#fff">W</text>
    <text x="88" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">WhatsApp User</text>
    <text x="88" y="48" text-anchor="middle" font-size="10" fill="#64748b">Image / PDF / Text</text>
  </g>

  <!-- Teams User -->
  <g transform="translate(60, 180)">
    <rect width="150" height="64" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="28" cy="26" r="12" fill="#6264A7"/>
    <text x="28" y="30" text-anchor="middle" font-size="13" fill="#fff">T</text>
    <text x="88" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">Teams User</text>
    <text x="88" y="48" text-anchor="middle" font-size="10" fill="#64748b">Image / PDF / Text</text>
  </g>

  <!-- Web User -->
  <g transform="translate(60, 260)">
    <rect width="150" height="64" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="28" cy="26" r="12" fill="#6366f1"/>
    <text x="28" y="30" text-anchor="middle" font-size="13" fill="#fff">U</text>
    <text x="88" y="30" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">Web User</text>
    <text x="88" y="48" text-anchor="middle" font-size="10" fill="#64748b">Drag &amp; drop / paste</text>
  </g>

  <!-- ═══════════════════ META GRAPH API ═══════════════════ -->

  <g transform="translate(280, 82)">
    <rect width="180" height="50" rx="8" fill="url(#grad-meta)" filter="url(#shadow)"/>
    <text x="90" y="22" text-anchor="middle" font-size="11" fill="#93c5fd">Meta Graph API</text>
    <text x="90" y="38" text-anchor="middle" font-size="10" fill="#bfdbfe">WhatsApp Business + FB Login</text>
  </g>

  <!-- MS Graph API -->
  <g transform="translate(280, 198)">
    <rect width="180" height="50" rx="8" fill="url(#grad-ms)" filter="url(#shadow)"/>
    <text x="90" y="22" text-anchor="middle" font-size="11" fill="#93c5fd">Microsoft Graph API</text>
    <text x="90" y="38" text-anchor="middle" font-size="10" fill="#bfdbfe">Teams Bot Framework</text>
  </g>

  <!-- Arrows: users → Meta/MS -->
  <line x1="210" y1="132" x2="280" y2="107" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="210" y1="212" x2="280" y2="223" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <!-- Arrow: web user direct to Vercel -->
  <line x1="210" y1="292" x2="280" y2="292" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="6,3"/>

  <!-- ═══════════════════ VERCEL / NEXT.JS APP ═══════════════════ -->

  <rect x="278" y="270" rx="12" fill="url(#grad-vercel)" stroke="#4338ca" stroke-width="1.5" width="520" height="252" filter="url(#shadow)"/>
  <text x="538" y="294" text-anchor="middle" font-size="14" font-weight="700" fill="#e0e7ff">▲ Vercel — Next.js 15 App Router</text>
  <text x="538" y="310" text-anchor="middle" font-size="10" fill="#a5b4fc">Runtime: Node.js · Edge Middleware · 60 s max duration</text>

  <!-- API Routes -->
  <rect x="296" y="324" width="484" height="94" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="310" y="344" font-size="11" font-weight="600" fill="#c7d2fe">API Routes</text>

  <!-- Route pills -->
  <g font-size="9" fill="#e0e7ff">
    <rect x="310" y="354" width="128" height="20" rx="4" fill="rgba(99,102,241,0.25)"/>
    <text x="374" y="368" text-anchor="middle">/api/whatsapp/webhook</text>

    <rect x="448" y="354" width="112" height="20" rx="4" fill="rgba(99,102,241,0.25)"/>
    <text x="504" y="368" text-anchor="middle">/api/teams/webhook</text>

    <rect x="570" y="354" width="72" height="20" rx="4" fill="rgba(99,102,241,0.25)"/>
    <text x="606" y="368" text-anchor="middle">/api/upload</text>

    <rect x="652" y="354" width="116" height="20" rx="4" fill="rgba(99,102,241,0.25)"/>
    <text x="710" y="368" text-anchor="middle">/api/proof/[id]</text>

    <rect x="310" y="380" width="102" height="20" rx="4" fill="rgba(99,102,241,0.25)"/>
    <text x="361" y="394" text-anchor="middle">/api/assets/…/approval</text>

    <rect x="422" y="380" width="64" height="20" rx="4" fill="rgba(99,102,241,0.25)"/>
    <text x="454" y="394" text-anchor="middle">/api/token</text>

    <rect x="496" y="380" width="64" height="20" rx="4" fill="rgba(99,102,241,0.25)"/>
    <text x="528" y="394" text-anchor="middle">/api/phones</text>

    <rect x="570" y="380" width="88" height="20" rx="4" fill="rgba(99,102,241,0.25)"/>
    <text x="614" y="394" text-anchor="middle">/r/[slug] (redirect)</text>

    <rect x="668" y="380" width="100" height="20" rx="4" fill="rgba(99,102,241,0.25)"/>
    <text x="718" y="394" text-anchor="middle">auth/callback</text>
  </g>

  <!-- Backend Libs -->
  <rect x="296" y="430" width="484" height="44" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="310" y="450" font-size="11" font-weight="600" fill="#c7d2fe">Libs</text>
  <text x="310" y="466" font-size="9" fill="#a5b4fc">
    <tspan>proof/runProof</tspan>
    <tspan dx="10" fill="#818cf8">·</tspan>
    <tspan dx="10">ocr/tesseract</tspan>
    <tspan dx="10" fill="#818cf8">·</tspan>
    <tspan dx="10">ai/provider (Gemini)</tspan>
    <tspan dx="10" fill="#818cf8">·</tspan>
    <tspan dx="10">whatsapp/*</tspan>
    <tspan dx="10" fill="#818cf8">·</tspan>
    <tspan dx="10">teams/*</tspan>
    <tspan dx="10" fill="#818cf8">·</tspan>
    <tspan dx="10">assets</tspan>
    <tspan dx="10" fill="#818cf8">·</tspan>
    <tspan dx="10">supabase/*</tspan>
  </text>

  <!-- Dashboard UI -->
  <rect x="296" y="482" width="484" height="30" rx="6" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <text x="538" y="501" text-anchor="middle" font-size="10" fill="#a5b4fc">Dashboard UI — upload, reports, brand profile, connect, usage, settings</text>

  <!-- Arrows: Meta/MS → Vercel -->
  <line x1="370" y1="132" x2="420" y2="270" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow-blue)" stroke-dasharray="6,3"/>
  <text x="375" y="205" font-size="9" fill="#818cf8">webhook</text>
  <line x1="370" y1="248" x2="420" y2="270" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow-blue)" stroke-dasharray="6,3"/>

  <!-- ═══════════════════ EXTERNAL SERVICES ═══════════════════ -->

  <!-- Google Gemini -->
  <g transform="translate(560, 565)">
    <rect width="200" height="56" rx="8" fill="url(#grad-google)" filter="url(#shadow)"/>
    <text x="100" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#fca5a5">Google Gemini API</text>
    <text x="100" y="40" text-anchor="middle" font-size="10" fill="#fecaca">Content analysis · Issue detection</text>
  </g>

  <!-- Supabase -->
  <g transform="translate(290, 565)">
    <rect width="220" height="56" rx="8" fill="url(#grad-supabase)" filter="url(#shadow)"/>
    <text x="110" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#a7f3d0">Supabase</text>
    <text x="110" y="40" text-anchor="middle" font-size="10" fill="#d1fae5">Postgres · Auth · Storage (artifacts)</text>
  </g>

  <!-- Tesseract OCR -->
  <g transform="translate(810, 565)">
    <rect width="180" height="56" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" filter="url(#shadow)"/>
    <text x="90" y="22" text-anchor="middle" font-size="12" font-weight="600" fill="#e2e8f0">Tesseract OCR</text>
    <text x="90" y="40" text-anchor="middle" font-size="10" fill="#94a3b8">Browser WASM · 90+ lang</text>
  </g>

  <!-- Arrows: Vercel → external -->
  <line x1="410" y1="522" x2="400" y2="565" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="538" y1="522" x2="660" y2="565" stroke="#f87171" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="660" y1="522" x2="900" y2="565" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)" stroke-dasharray="4,3"/>

  <!-- ═══════════════════ PROOF PIPELINE ═══════════════════ -->

  <rect x="60" y="375" width="190" height="148" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="155" y="400" text-anchor="middle" font-size="11" font-weight="700" fill="#f1f5f9">Proof Pipeline</text>
  <text x="155" y="416" text-anchor="middle" font-size="9" fill="#64748b">src/lib/proof/runProof.ts</text>

  <g font-size="10" fill="#cbd5e1">
    <rect x="80" y="430" width="150" height="22" rx="4" fill="rgba(255,255,255,0.06)"/>
    <text x="155" y="445" text-anchor="middle">1. Fetch asset bytes</text>

    <rect x="80" y="458" width="150" height="22" rx="4" fill="rgba(255,255,255,0.06)"/>
    <text x="155" y="473" text-anchor="middle">2. OCR → raw text</text>

    <rect x="80" y="486" width="150" height="22" rx="4" fill="rgba(255,255,255,0.06)"/>
    <text x="155" y="501" text-anchor="middle">3. AI analysis → issues</text>
  </g>

  <!-- Arrow: proof → Vercel -->
  <line x1="250" y1="449" x2="296" y2="449" stroke="#6366f1" stroke-width="1.5" marker-end="url(#arrow-blue)"/>

  <!-- Arrow: proof → Gemini -->
  <line x1="250" y1="501" x2="560" y2="585" stroke="#f87171" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

  <!-- ═══════════════════ META APP SERVICES ═══════════════════ -->

  <g transform="translate(810, 100)">
    <rect width="180" height="64" rx="8" fill="url(#grad-meta)" filter="url(#shadow)"/>
    <text x="90" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#93c5fd">FB Login for Business</text>
    <text x="90" y="38" text-anchor="middle" font-size="10" fill="#bfdbfe">Code → long-lived token</text>
    <text x="90" y="52" text-anchor="middle" font-size="9" fill="#60a5fa">Embedded Signup flow</text>
  </g>

  <g transform="translate(810, 185)">
    <rect width="180" height="64" rx="8" fill="url(#grad-meta)" filter="url(#shadow)"/>
    <text x="90" y="22" text-anchor="middle" font-size="11" font-weight="600" fill="#93c5fd">Meta App Review</text>
    <text x="90" y="38" text-anchor="middle" font-size="10" fill="#bfdbfe">whatsapp_business_management</text>
    <text x="90" y="52" text-anchor="middle" font-size="9" fill="#60a5fa">whatsapp_business_messaging</text>
  </g>

  <!-- Arrow: token exchange -->
  <line x1="810" y1="400" x2="798" y2="397" stroke="#93c5fd" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ═══════════════════ ENV VARS NOTE ═══════════════════ -->

  <rect x="60" y="640" width="930" height="160" rx="10" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="525" y="664" text-anchor="middle" font-size="12" font-weight="700" fill="#f1f5f9">Environment &amp; Config</text>

  <g font-size="10" fill="#94a3b8">
    <text x="80" y="690" fill="#c7d2fe" font-weight="600">Supabase</text>
    <text x="80" y="708">NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY</text>

    <text x="80" y="732" fill="#fca5a5" font-weight="600">Google Gemini</text>
    <text x="80" y="750">GEMINI_API_KEY, GEMINI_MODEL (default: gemini-2.5-flash), AI_PROVIDER (default: gemini)</text>

    <text x="80" y="774" fill="#93c5fd" font-weight="600">Meta / WhatsApp</text>
    <text x="80" y="792">FB_APP_ID, FB_APP_SECRET, NEXT_PUBLIC_FB_APP_ID, NEXT_PUBLIC_TP_CONFIG_ID, TP_CONFIG_ID, FB_REG_PIN, TP_CONTACT_EMAIL, FB_REDIRECT_URI, NEXT_PUBLIC_FB_GRAPH_API_VERSION, NEXT_PUBLIC_APP_URL</text>
  </g>
</svg>
