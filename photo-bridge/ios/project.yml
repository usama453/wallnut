name: PhotoBridge
options:
  bundleIdPrefix: com.photobridge
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_PREVIEWS: true
targets:
  PhotoBridge:
    type: application
    platform: iOS
    sources:
      - path: PhotoBridge
    info:
      path: PhotoBridge/Info.plist
      properties:
        CFBundleDisplayName: PhotoBridge
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "PhotoBridge reads your photo originals to back them up to your desktop computer. Photos are streamed directly to the transfer; nothing is copied into app storage."
        NSLocalNetworkUsageDescription: "PhotoBridge discovers your desktop computer on the local Wi-Fi network to transfer photos."
        NSBonjourServices:
          - "_photobridge._tcp"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photobridge.ios
        INFOPLIST_FILE: PhotoBridge/Info.plist
        GENERATE_INFOPLIST_FILE: false
  PhotoBridgeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PhotoBridgeTests
    dependencies:
      - target: PhotoBridge
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.photobridge.ios.tests
schemes:
  PhotoBridgeTests:
    build:
      targets:
        PhotoBridge: all
        PhotoBridgeTests: all
    test:
      config: Debug
      targets:
        - PhotoBridgeTests
  PhotoBridge:
    build:
      targets:
        PhotoBridge: all
        PhotoBridgeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PhotoBridgeTests